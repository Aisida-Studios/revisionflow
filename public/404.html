<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#14532d" />
    <title>Page not found | RevisionFlow</title>
    <!-- Served (with a 404 status) by the /assets/* rule in netlify.toml when a built file is missing, for example in a
         tab left open across a deploy. Self-contained on purpose: it must not depend on any file that could be missing. -->
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --text: #111827; --muted: #374151; --accent: #14532d; --accent-hover: #0f3d22; --on-accent: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0c0f0d; --text: #f1f5f2; --muted: #a9b6ac; --accent: #16a34a; --accent-hover: #22c55e; --on-accent: #0c0f0d; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        background: var(--bg); color: var(--text);
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main { max-width: 420px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 800; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
      a {
        display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px;
        border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none;
      }
      a:hover { background: var(--accent-hover); }
    </style>
  </head>
  <body>
    <main>
      <h1>This page has moved or no longer exists</h1>
      <p>If RevisionFlow was open while we updated it, a fresh load of the app fixes this.</p>
      <a href="/">Back to RevisionFlow</a>
    </main>
  </body>
</html>
