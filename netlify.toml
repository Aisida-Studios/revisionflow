[build]
  command   = "npm install --prefix netlify/functions && npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Function timeouts ──────────────────────────────────────────────────────────
# Netlify's default synchronous function timeout is 10 seconds. tutor.js waits on a single
# Mistral completion that can legitimately take longer than that — a detailed answer-marking
# response, a multi-week study plan, or a batch of exam questions can all take 15-25+ seconds
# to generate, especially under load. When the PLATFORM kills the function mid-request (rather
# than the function returning its own error), the client gets a raw 502 with a non-JSON body —
# which is exactly the "Server returned a non-JSON response (HTTP 502)" error. 26 seconds is the
# maximum Netlify allows for a synchronous function.
# NOTE: this setting only takes effect on a Netlify plan that supports extended function
# timeouts (Pro tier and above) — on the free/Starter tier every function is hard-capped at 10
# seconds no matter what is configured here. tutor.js's own internal timeout (see MISTRAL_TIMEOUT_MS
# in that file) is what protects you on the free tier — this config is what lets it actually use
# the extra time once you're on a plan that allows it.
[functions."tutor"]
  timeout = 26

# ── Security headers ──────────────────────────────────────────────────────────
# Applied to every response Netlify serves.
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent your pages being embedded in iframes on other sites (clickjacking)
    X-Frame-Options = "DENY"

    # Stop browsers guessing content types (MIME sniffing attacks)
    X-Content-Type-Options = "nosniff"

    # Only send the origin (not the full URL) in Referer headers to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable browser features you don't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"

    # Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Required for Firebase Auth's signInWithPopup to work reliably. Without this, some
    # browsers/CDNs default to a stricter Cross-Origin-Opener-Policy that silently breaks the
    # popup's ability to postMessage its result back to this window — the Google sign-in itself
    # completes, but Firebase never finds out, times out, and reports a generic "popup closed"
    # error even though nobody closed anything.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

    # Content Security Policy — controls what resources the browser is allowed to load
    # 'self'          = your own domain only
    # firebase/google = Firebase Auth + Firestore
    # stripe.com      = Stripe Checkout redirect (not an embed)
    # mistral         = not called from browser (server-side only, omitted)
    # frame-src       = Firebase Auth's popup/iframe handshake (accounts.google.com,
    #                   *.firebaseapp.com) plus the Stripe Checkout embed
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.stripe.com; frame-src https://js.stripe.com https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self';"

# ── Domain migration — old Netlify subdomain → custom domain ──────────────────
# MUST stay first. This matches on hostname, not just path, so it needs to run before any
# rule below that has no domain restriction (bot detection, /api/*, the SPA catch-all) — those
# would otherwise keep matching requests to the old subdomain and quietly serve content there
# forever instead of sending visitors to the real domain. force = true is required because
# every page genuinely exists on this domain too (same deploy) — without it, Netlify serves
# the file instead of redirecting.
[[redirects]]
  from   = "https://revision-flow.netlify.app/*"
  to     = "https://www.revisionflow.co.uk/:splat"
  status = 301
  force  = true

# ── Bot detection — serve static landing page to crawlers ─────────────────────
[[redirects]]
  from   = "/"
  to     = "/landing.html"
  status = 200
  conditions = {UserAgent = ["Googlebot","Googlebot-Mobile","Googlebot-Image","Bingbot","bingbot","Slurp","DuckDuckBot","Baiduspider","YandexBot","Sogou","Exabot","facebookexternalhit","Twitterbot","LinkedInBot","WhatsApp","Slackbot","TelegramBot","Discordbot"]}

# ── API routes — MUST come before the /* catch-all ────────────────────────────
[[redirects]]
  from   = "/api/tutor"
  to     = "/.netlify/functions/tutor"
  status = 200

[[redirects]]
  from   = "/api/admin"
  to     = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from   = "/api/notify"
  to     = "/.netlify/functions/notify"
  status = 200

[[redirects]]
  from   = "/api/stripe"
  to     = "/.netlify/functions/stripe"
  status = 200

[[redirects]]
  from   = "/api/referral"
  to     = "/.netlify/functions/referral"
  status = 200

[[redirects]]
  from   = "/api/friends"
  to     = "/.netlify/functions/friends"
  status = 200

# ── React app — catch-all must be last ───────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
