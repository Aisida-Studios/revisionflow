[build]
  command   = "npm install --prefix netlify/functions && npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ── Security headers ──────────────────────────────────────────────────────────
# Applied to every response Netlify serves.
[[headers]]
  for = "/*"
  [headers.values]
    # Stop other sites embedding your pages in iframes (clickjacking). SAMEORIGIN rather than DENY so this site can frame
    # its own pages, which Firebase Auth does for its sign-in handler when the auth domain is this domain (see the
    # commented-out /__/auth rule near the end of this file). Other sites still cannot frame it.
    X-Frame-Options = "SAMEORIGIN"

    # Stop browsers guessing content types (MIME sniffing attacks)
    X-Content-Type-Options = "nosniff"

    # Only send the origin (not the full URL) in Referer headers to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable browser features you don't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"

    # Force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Required for Firebase Auth's signInWithPopup to work reliably. Without this, some
    # browsers/CDNs default to a stricter Cross-Origin-Opener-Policy that silently breaks the
    # popup's ability to postMessage its result back to this window — the Google sign-in itself
    # completes, but Firebase never finds out, times out, and reports a generic "popup closed"
    # error even though nobody closed anything.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

    # Content Security Policy — controls what resources the browser is allowed to load
    # 'self'          = your own domain only
    # firebase/google = Firebase Auth + Firestore
    # stripe.com      = Stripe Checkout redirect (not an embed)
    # mistral         = not called from browser (server-side only, omitted)
    # frame-src       = Firebase Auth's popup/iframe handshake (accounts.google.com,
    #                   *.firebaseapp.com, and 'self' for a first-party auth domain) plus the Stripe Checkout embed
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.stripe.com; frame-src 'self' https://js.stripe.com https://*.firebaseapp.com https://accounts.google.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self';"

# ── Domain migration — old Netlify subdomain → custom domain ──────────────────
# MUST stay first. This matches on hostname, not just path, so it needs to run before any
# rule below that has no domain restriction (bot detection, /api/*, the SPA catch-all) — those
# would otherwise keep matching requests to the old subdomain and quietly serve content there
# forever instead of sending visitors to the real domain. force = true is required because
# every page genuinely exists on this domain too (same deploy) — without it, Netlify serves
# the file instead of redirecting.
[[redirects]]
  from   = "https://revision-flow.netlify.app/*"
  to     = "https://www.revisionflow.co.uk/:splat"
  status = 301
  force  = true

# ── Bot detection — serve static landing page to crawlers ─────────────────────
[[redirects]]
  from   = "/"
  to     = "/landing.html"
  status = 200
  conditions = {UserAgent = ["Googlebot","Googlebot-Mobile","Googlebot-Image","Bingbot","bingbot","Slurp","DuckDuckBot","Baiduspider","YandexBot","Sogou","Exabot","facebookexternalhit","Twitterbot","LinkedInBot","WhatsApp","Slackbot","TelegramBot","Discordbot"]}

# ── API routes — MUST come before the /* catch-all ────────────────────────────
[[redirects]]
  from   = "/api/tutor"
  to     = "/.netlify/functions/tutor"
  status = 200

[[redirects]]
  from   = "/api/entitlements"
  to     = "/.netlify/functions/entitlements"
  status = 200

[[redirects]]
  from   = "/api/admin"
  to     = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from   = "/api/admin-metrics"
  to     = "/.netlify/functions/admin-metrics"
  status = 200

[[redirects]]
  from   = "/api/announcements"
  to     = "/.netlify/functions/announcements"
  status = 200

[[redirects]]
  from   = "/api/notify"
  to     = "/.netlify/functions/notify"
  status = 200

[[redirects]]
  from   = "/api/stripe"
  to     = "/.netlify/functions/stripe"
  status = 200

[[redirects]]
  from   = "/api/referral"
  to     = "/.netlify/functions/referral"
  status = 200

[[redirects]]
  from   = "/api/friends"
  to     = "/.netlify/functions/friends"
  status = 200

[[redirects]]
  from   = "/api/public-data"
  to     = "/.netlify/functions/public-data"
  status = 200

# ── Missing built assets are a real 404 ───────────────────────────────────────
# Without this the catch-all below answers a missing /assets/<hash>.js (an old tab after a deploy) with index.html and a
# 200, which the browser then fails to run as a script and the service worker used to cache. A file that exists is still
# served as normal: this rule only applies when nothing is at that path.
[[redirects]]
  from   = "/assets/*"
  to     = "/404.html"
  status = 404

# ── First-party Firebase Auth handler (NOT enabled: it needs the Firebase project id) ─
# Only needed if Google sign-in fails inside the installed app, because the sign-in redirect lives on
# <project>.firebaseapp.com while the app lives on www.revisionflow.co.uk, and the result can be lost between the two.
# To switch it on:
#   1. In Netlify's environment variables set VITE_FIREBASE_AUTH_DOMAIN=www.revisionflow.co.uk, then redeploy.
#   2. In the Google OAuth client that Firebase Auth uses, add https://www.revisionflow.co.uk/__/auth/handler as an
#      authorised redirect URI.
#   3. In the Firebase console (Authentication > Settings > Authorised domains) add www.revisionflow.co.uk.
#   4. Replace <PROJECT_ID> below with the Firebase project id (Netlify cannot read an environment variable inside a
#      redirect rule), uncomment the rule, and keep it ABOVE the /* catch-all so the catch-all does not swallow it.
# [[redirects]]
#   from   = "/__/auth/*"
#   to     = "https://<PROJECT_ID>.firebaseapp.com/__/auth/:splat"
#   status = 200
#   force  = true

# ── React app — catch-all must be last ───────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
